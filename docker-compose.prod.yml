services:
  youtube-manager:
    build: .
    container_name: youtube-manager
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - /app/data/youtube-manager/.env
    volumes:
      - /app/data/youtube-manager:/app/data/youtube-manager
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
